services:
  frontend:
    image: node:22-alpine
    container_name: tanodbukid-frontend
    working_dir: /app
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PHP_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tanodbukid-backend
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    environment:
      TANODBUKID_DB_HOST: database
      TANODBUKID_AI_URL: http://ai:8080/predict
      TANODBUKID_DB_NAME: tanodbukid_db
      TANODBUKID_DB_USER: tanodbukid
      TANODBUKID_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TANODBUKID_DEV_OTP: "0"
    command: php -S 0.0.0.0:8000 -t /var/www/html /var/www/html/router.php
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: ./ai
    container_name: tanodbukid-ai
    environment:
      HF_HOME: /models
      MODEL_ID: neghani/plantvillage-mobilenetv2
    volumes:
      - ai_models:/models
    restart: unless-stopped


  database:
    image: mysql:8.4
    container_name: tanodbukid-mysql
    environment:
      MYSQL_DATABASE: tanodbukid_db
      MYSQL_USER: tanodbukid
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  ai_models:
  mysql_data:
  frontend_node_modules: